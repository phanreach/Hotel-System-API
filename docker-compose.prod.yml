services:
  db:
    image: postgres:16
    container_name: hotel-system-db
    environment:
      POSTGRES_DB: hotel_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-system-api
    environment:
      DB_URL: jdbc:postgresql://db:5432/hotel_management
      DB_USERNAME: postgres
      DB_PASSWORD: password
    ports:
      - "8081:8081"
    volumes:
      - uploads:/app/uploads
    depends_on:
      - db

volumes:
  db_data:
  uploads:
